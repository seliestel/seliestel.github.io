# Site settings
title: Ignasi Ribó
description: Personal page of Ignasi Ribó, Catalan author and scholar.
url: https://www.ignasiribo.com
email: iribolabastida@gmail.com
lang: en
# Default picture shown when a page is shared (book pages use their cover)
share_image: /assets/img/Ignasi-photo.jpg

# Google Analytics 4: paste your Measurement ID between the quotes
# (it looks like "G-XXXXXXXXXX"). Leave it empty to turn analytics off.
google_analytics: ""

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-sitemap

collections:
  books:
    output: true
    permalink: /books/:path/

defaults:
  - scope:
      path: ""
      type: books
    values:
      layout: book

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
